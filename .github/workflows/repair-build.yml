name: Repair build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir sintaxe do componente de chamado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/chamados.$id.tsx')
          text = path.read_text()
          old = 'function Info({ label, value }: { label: string; value?: string | null }) { return (<div><div className="text-[10px] font-semibold uppercase tracking-wider text-muted-foreground">{label}</div><div className="mt-0.5">{value || "—"}</div></div> }'
          new = 'function Info({ label, value }: { label: string; value?: string | null }) { return (<div><div className="text-[10px] font-semibold uppercase tracking-wider text-muted-foreground">{label}</div><div className="mt-0.5">{value || "—"}</div></div>); }'
          if old not in text:
              raise SystemExit('trecho esperado não encontrado')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commitar correção
        run: |
          git config user.name 'BigDataMundoVem'
          git config user.email 'bigdata3@mundovem.com.br'
          git add 'src/routes/_authenticated/chamados.$id.tsx'
          git rm .github/workflows/repair-build.yml
          git commit -m 'fix: corrige sintaxe do componente de chamado'
          git push