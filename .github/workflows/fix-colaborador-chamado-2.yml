name: Fix colaborador chamado 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Corrigir
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('src/routes/_authenticated/chamados.$id.tsx')
          t=ui.read_text(); old='const paginaSomenteLeitura = !podeAlterarChamado;'; new='const paginaSomenteLeitura = !podeAlterarChamado && chamado.solicitante_id !== user.id;'
          assert old in t
          ui.write_text(t.replace(old,new,1))
          fn=Path('src/lib/chamado.functions.ts'); t=fn.read_text()
          old='if (!(await canEditFilaTicket(supabase, context.userId, ticket))) throw new Error("Somente o admin, o atendente responsável ou um atendente de um chamado sem responsável pode comentar neste chamado.");'
          new='const isRequester = ticket.solicitante_id === context.userId;\n  const canInteract = isRequester || await canEditFilaTicket(supabase, context.userId, ticket);\n  if (!canInteract) throw new Error("Somente o solicitante, o admin, o atendente responsável ou um atendente de um chamado sem responsável pode comentar neste chamado.");\n  if (data.interno && !isRequester && !(await hasPermission(supabase, context.userId, "ticket.comment.internal"))) throw new Error("Nota interna disponível somente para atendimento.");\n  if (data.interno && isRequester) throw new Error("Solicitantes não podem adicionar notas internas.");'
          assert old in t
          fn.write_text(t.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/routes/_authenticated/chamados.$id.tsx' src/lib/chamado.functions.ts
          git rm .github/workflows/fix-colaborador-chamado.yml .github/workflows/fix-colaborador-chamado-2.yml
          git commit -m 'fix: permitir colaborador interagir no próprio chamado'
          git push
