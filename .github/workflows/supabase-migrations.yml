name: Supabase Migrations

on:
  pull_request:
    paths:
      - "supabase/**"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start

      - name: Apply all migrations from scratch
        run: supabase db reset

      - name: Verify migration history
        run: supabase migration list --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop
