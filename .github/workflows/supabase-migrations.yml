name: Supabase Migrations

on:
  pull_request:
    paths:
      - "supabase/**"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply all migrations from scratch
        run: supabase db reset

      - name: Verify migration history
        run: supabase migration list --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop

      - name: Deploy migrations to new Supabase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref nstmbtimaghenkpjqbih --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
